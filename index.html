<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>North & South: Final Fix</title>
    <style>
        /* FIX: Gunakan position fixed untuk mencegah address bar browser menutupi game */
        body {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            margin: 0; padding: 0; background-color: #111;
            overflow: hidden; touch-action: none; font-family: 'Segoe UI', Tahoma, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        
        #game-wrapper {
            position: absolute; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        
        /* FIX: Biarkan CSS yang mengatur skala canvas secara otomatis (Letterboxing) */
        canvas {
            width: 100%; height: 100%; object-fit: contain;
            background-color: #55a630;
        }
        
        /* UI Panel Atas */
        .hud {
            position: absolute; top: 15px; width: 90%; max-width: 800px;
            display: flex; justify-content: space-between; z-index: 10; pointer-events: none;
        }
        .badge {
            background: rgba(0,0,0,0.7); padding: 8px 20px; border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.2); font-weight: bold; color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); backdrop-filter: blur(5px);
        }

        /* Mobile Controls (Posisi absolut ke bawah layar fixed) */
        #controls {
            position: absolute; bottom: 20px; width: 95%; max-width: 850px;
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 20;
        }
        
        .dpad { display: grid; grid-template-columns: 60px 60px 60px; grid-template-rows: 60px 60px 60px; gap: 5px; }
        .btn {
            background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.4);
            border-radius: 15px; display: flex; justify-content: center; align-items: center;
            font-size: 28px; color: white; cursor: pointer; backdrop-filter: blur(4px);
        }
        .btn:active, .btn.active { background: rgba(255,255,255,0.9); transform: scale(0.95); color: black; }
        .empty { visibility: hidden; }

        .actions { display: flex; flex-direction: column; gap: 10px; width: 150px; }
        .squad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .act-btn {
            background: #2c3e50; border: 2px solid #7f8c8d; border-radius: 12px; color: white;
            font-weight: bold; font-size: 14px; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5); height: 45px; cursor: pointer;
        }
        .act-btn.selected { background: #f1c40f; color: #111; border-color: #fff; }
        .act-btn:active { transform: scale(0.95); }
        .btn-full { grid-column: span 2; }
        
        .fire-btn { 
            background: #e74c3c; border: 3px solid #ff7675; border-radius: 20px; 
            font-size: 20px; height: 60px; display: flex; justify-content: center; align-items: center;
            color: white; font-weight: bold; cursor: pointer;
        }
        .fire-btn:active, .fire-btn.active { background: #c0392b; border-color: #e74c3c; transform: scale(0.95); }

        /* MODAL GAME OVER (PLAY AGAIN) */
        #game-over-modal {
            display: none; position: absolute; z-index: 100;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); border: 3px solid #f1c40f; border-radius: 15px;
            padding: 30px; text-align: center; color: white; width: 250px;
        }
        #btn-restart {
            margin-top: 20px; padding: 12px 20px; background: #f1c40f; color: #111;
            border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); width: 100%;
        }
        #btn-restart:active { transform: scale(0.95); }

        @media (max-width: 650px) {
            .dpad { grid-template-columns: 50px 50px 50px; grid-template-rows: 50px 50px 50px; }
            .actions { width: 140px; }
            .act-btn { height: 40px; font-size: 12px; }
            .fire-btn { height: 50px; font-size: 18px; }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        
        <div class="hud">
            <div class="badge" style="color: #4facfe;">UNION</div>
            <div class="badge" id="squad-hud" style="color: #f1c40f;">Select: INFANTRY</div>
            <div class="badge" style="color: #ff4757;">CONFEDERATE</div>
        </div>

        <div id="controls">
            <!-- D-PAD -->
            <div class="dpad">
                <div class="empty"></div><div class="btn" id="btn-up">▲</div><div class="empty"></div>
                <div class="btn" id="btn-left">◀</div><div class="btn" id="btn-down">▼</div><div class="btn" id="btn-right">▶</div>
            </div>
            
            <!-- ACTION BUTTONS -->
            <div class="actions">
                <div class="squad-grid">
                    <div class="act-btn selected" id="btn-inf" onclick="switchSquad('infantry')">INF</div>
                    <div class="act-btn" id="btn-cav" onclick="switchSquad('cavalry')">CAV</div>
                    <div class="act-btn btn-full" id="btn-can" onclick="switchSquad('cannon')">CANNON</div>
                </div>
                <div class="fire-btn" id="btn-fire">🔥 FIRE</div>
            </div>
        </div>
        
        <!-- MODAL PLAY AGAIN -->
        <div id="game-over-modal">
            <h2 id="game-over-msg" style="margin-top: 0;">Victory!</h2>
            <button id="btn-restart" onclick="resetGame()">Play Again</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const bgImage = new Image();
    bgImage.src = 'image_5.png'; // Map Background

    // Input Controller
    const keys = { w:false, a:false, s:false, d:false, space:false };
    
    function bindBtn(id, key) {
        const el = document.getElementById(id);
        if(!el) return;
        const press = (e) => { e.preventDefault(); keys[key] = true; el.classList.add('active'); };
        const release = (e) => { e.preventDefault(); keys[key] = false; el.classList.remove('active'); };
        el.addEventListener('touchstart', press, {passive: false}); el.addEventListener('touchend', release, {passive: false});
        el.addEventListener('mousedown', press); el.addEventListener('mouseup', release); el.addEventListener('mouseleave', release);
    }
    bindBtn('btn-up', 'w'); bindBtn('btn-down', 's'); bindBtn('btn-left', 'a'); bindBtn('btn-right', 'd'); bindBtn('btn-fire', 'space');

    // State Game
    let activeSquad = 'infantry';
    window.switchSquad = function(type) {
        activeSquad = type;
        document.getElementById('squad-hud').innerText = 'Select: ' + type.toUpperCase();
        document.querySelectorAll('.squad-grid .act-btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('btn-' + type.substring(0,3)).classList.add('selected');
    };

    let gameOver = false;
    let union, confed, projectiles, fx;

    function init(team, startX, dir) {
        for(let i=0; i<6; i++) team.infantry.push({ x: startX + (i%2)*25*-dir, y: 150 + Math.floor(i/2)*40, speed: 1.5, cd: 0, alive: true });
        for(let i=0; i<3; i++) team.cavalry.push({ x: startX + 70*-dir, y: 170 + i*50, speed: 3.5, alive: true });
    }

    // Fungsi Reset Game (Play Again)
    window.resetGame = function() {
        document.getElementById('game-over-modal').style.display = 'none';
        
        union = { color: '#3498db', cannon: { x: 50, y: 225, alive: true, cd: 0, speed: 2 }, infantry: [], cavalry: [] };
        confed = { color: '#e74c3c', cannon: { x: 750, y: 225, alive: true, cd: 0, speed: 1.5 }, infantry: [], cavalry: [], aiState: 'infantry', aiTimer: 0 };
        projectiles = []; fx = [];
        
        init(union, 150, 1);
        init(confed, 650, -1);
        
        gameOver = false;
        keys.space = false; // Hindari tembakan otomatis saat reset
    };

    // Panggil reset pertama kali untuk inisialisasi awal
    resetGame();

    function moveGroup(group, dx, dy) {
        group.forEach(u => {
            if(u.alive) {
                u.x += dx * u.speed; u.y += dy * u.speed;
                if(u.x < 15) u.x = 15; if(u.x > 785) u.x = 785;
                if(u.y < 50) u.y = 50; if(u.y > 400) u.y = 400;
            }
        });
    }

    function fireCannon(cannon, isUnion) {
        if(cannon.cd <= 0 && cannon.alive) {
            projectiles.push({ x: isUnion ? cannon.x+20 : cannon.x-20, y: cannon.y, vx: isUnion ? 8 : -8, type: 'ball', isUnion: isUnion, life: 65 });
            cannon.cd = 60;
        }
    }

    function update() {
        if(gameOver) return;

        let dx = 0, dy = 0;
        if(keys.w) dy = -1; if(keys.s) dy = 1;
        if(keys.a) dx = -1; if(keys.d) dx = 1;

        if(activeSquad === 'cannon' && union.cannon.alive) {
            union.cannon.y += dy * union.cannon.speed;
            if(union.cannon.y < 50) union.cannon.y = 50; if(union.cannon.y > 400) union.cannon.y = 400;
            if(keys.space) fireCannon(union.cannon, true);
        } else if(activeSquad === 'infantry') {
            moveGroup(union.infantry, dx, dy);
            if(keys.space) union.infantry.forEach(u => {
                if(u.alive && u.cd <= 0) { 
                    projectiles.push({ x: u.x+10, y: u.y, vx: 8, type: 'bullet', isUnion: true, life: 40 }); 
                    u.cd = 40; 
                }
            });
        } else if(activeSquad === 'cavalry') {
            moveGroup(union.cavalry, dx, dy);
        }

        if(union.cannon.cd > 0) union.cannon.cd--;
        union.infantry.forEach(u => { if(u.cd > 0) u.cd--; });

        // AI
        confed.aiTimer--;
        if(confed.aiTimer <= 0) {
            let ch = [];
            if(confed.infantry.some(u=>u.alive)) ch.push('infantry');
            if(confed.cavalry.some(u=>u.alive)) ch.push('cavalry');
            if(confed.cannon.alive) ch.push('cannon');
            if(ch.length > 0) { confed.aiState = ch[Math.floor(Math.random()*ch.length)]; confed.aiTimer = 60 + Math.random()*40; }
        }

        if(confed.aiState === 'cannon' && confed.cannon.alive) {
            confed.cannon.y += (Math.random() > 0.5 ? 1 : -1) * confed.cannon.speed;
            if(Math.random() < 0.03) fireCannon(confed.cannon, false);
        } else if(confed.aiState === 'infantry') {
            moveGroup(confed.infantry, -0.8, (Math.random()-0.5));
            if(Math.random() < 0.05) confed.infantry.forEach(u => {
                if(u.alive && u.cd <= 0 && Math.random() < 0.3) { projectiles.push({ x: u.x-10, y: u.y, vx: -8, type: 'bullet', isUnion: false, life: 40 }); u.cd = 40; }
            });
        } else if(confed.aiState === 'cavalry') {
            moveGroup(confed.cavalry, -1.5, (Math.random()-0.5)*2);
        }
        if(confed.cannon.cd > 0) confed.cannon.cd--;
        confed.infantry.forEach(u => { if(u.cd > 0) u.cd--; });

        // Projectiles
        for(let i=projectiles.length-1; i>=0; i--) {
            let p = projectiles[i]; p.x += p.vx; p.life--;
            if(p.type === 'ball' && p.life <= 0) {
                fx.push({ x: p.x, y: p.y, r: 0, life: 20 });
                let eTeam = p.isUnion ? confed : union;
                eTeam.infantry.forEach(u => { if(u.alive && Math.hypot(u.x-p.x, u.y-p.y) < 40) u.alive = false; });
                eTeam.cavalry.forEach(u => { if(u.alive && Math.hypot(u.x-p.x, u.y-p.y) < 40) u.alive = false; });
                if(eTeam.cannon.alive && Math.hypot(eTeam.cannon.x-p.x, eTeam.cannon.y-p.y) < 45) eTeam.cannon.alive = false;
                projectiles.splice(i, 1); continue;
            }
            if(p.type === 'bullet') {
                let hit = false; let eTeam = p.isUnion ? confed : union;
                eTeam.infantry.forEach(u => { if(!hit && u.alive && Math.abs(u.x-p.x)<12 && Math.abs(u.y-p.y)<12) { u.alive = false; hit = true; }});
                eTeam.cavalry.forEach(u => { if(!hit && u.alive && Math.abs(u.x-p.x)<15 && Math.abs(u.y-p.y)<15) { u.alive = false; hit = true; }});
                if(hit || p.life <= 0) projectiles.splice(i, 1);
            }
        }
        for(let i=fx.length-1; i>=0; i--) { fx[i].r += (40 - fx[i].r)*0.2; fx[i].life--; if(fx[i].life <= 0) fx.splice(i,1); }

        // Melee
        union.cavalry.forEach(uc => {
            if(!uc.alive) return;
            confed.infantry.forEach(ci => { if(ci.alive && Math.hypot(uc.x-ci.x, uc.y-ci.y) < 20) ci.alive = false; });
            confed.cavalry.forEach(cc => { if(cc.alive && Math.hypot(uc.x-cc.x, uc.y-cc.y) < 20) { cc.alive = false; uc.alive = false; }});
            if(confed.cannon.alive && Math.hypot(uc.x-confed.cannon.x, uc.y-confed.cannon.y) < 25) confed.cannon.alive = false;
        });

        // Cek Pemenang (Panggil Layar Game Over)
        let uAlive = union.cannon.alive || union.infantry.some(u=>u.alive) || union.cavalry.some(u=>u.alive);
        let cAlive = confed.cannon.alive || confed.infantry.some(u=>u.alive) || confed.cavalry.some(u=>u.alive);
        
        if(!uAlive || !cAlive) {
            gameOver = true;
            const modal = document.getElementById('game-over-modal');
            const msg = document.getElementById('game-over-msg');
            msg.innerHTML = !uAlive ? "DEFEAT!<br><span style='font-size:14px'>Pasukan Union Hancur</span>" : "VICTORY!<br><span style='font-size:14px'>Pasukan Confederate Hancur</span>";
            msg.style.color = !uAlive ? "#e74c3c" : "#2ecc71";
            modal.style.display = "block";
        }
    }

    function render() {
        ctx.clearRect(0,0,800,450);
        if (bgImage.complete) ctx.drawImage(bgImage, 0, 0, 800, 450);
        else { ctx.fillStyle = "#55a630"; ctx.fillRect(0,0,800,450); }
        
        ctx.fillStyle = "rgba(241, 196, 15, 0.4)";
        if(activeSquad === 'cannon' && union.cannon.alive) ctx.fillRect(union.cannon.x-25, union.cannon.y-20, 50, 40);
        else if(activeSquad === 'infantry') union.infantry.forEach(u => { if(u.alive) { ctx.beginPath(); ctx.ellipse(u.x, u.y, 16, 10, 0, 0, Math.PI*2); ctx.fill(); }});
        else if(activeSquad === 'cavalry') union.cavalry.forEach(u => { if(u.alive) { ctx.beginPath(); ctx.ellipse(u.x, u.y, 22, 12, 0, 0, Math.PI*2); ctx.fill(); }});

        function drawUnit(u, teamStr, type) {
            if(!u.alive) return;
            let col = teamStr === 'union' ? union.color : confed.color;
            ctx.fillStyle = col;
            ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 4; ctx.shadowOffsetY = 3;
            
            if(type === 'cannon') {
                ctx.fillRect(u.x-15, u.y-10, 30, 20); 
                ctx.fillStyle = "#2c3e50"; 
                ctx.fillRect(teamStr === 'union' ? u.x : u.x-25, u.y-3, 25, 6); 
            } else if (type === 'infantry') {
                ctx.beginPath(); ctx.arc(u.x, u.y-5, 6, 0, Math.PI*2); ctx.fill(); 
                ctx.fillRect(u.x-5, u.y+1, 10, 8); 
            } else if (type === 'cavalry') {
                ctx.fillStyle = "#5d4037"; ctx.fillRect(u.x-12, u.y-6, 24, 12); 
                ctx.fillStyle = col; ctx.beginPath(); ctx.arc(u.x, u.y-6, 6, 0, Math.PI*2); ctx.fill(); 
            }
            ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
        }

        drawUnit(union.cannon, 'union', 'cannon');
        union.infantry.forEach(u => drawUnit(u, 'union', 'infantry'));
        union.cavalry.forEach(u => drawUnit(u, 'union', 'cavalry'));
        drawUnit(confed.cannon, 'confed', 'cannon');
        confed.infantry.forEach(u => drawUnit(u, 'confed', 'infantry'));
        confed.cavalry.forEach(u => drawUnit(u, 'confed', 'cavalry'));

        projectiles.forEach(p => {
            ctx.fillStyle = p.type==='ball' ? "#111" : "#f1c40f";
            ctx.beginPath(); ctx.arc(p.x, p.y, p.type==='ball'?6:3, 0, Math.PI*2); ctx.fill();
        });
        fx.forEach(f => {
            ctx.fillStyle = `rgba(231, 76, 60, ${f.life/20})`;
            ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = `rgba(241, 196, 15, ${f.life/20})`;
            ctx.beginPath(); ctx.arc(f.x, f.y, f.r*0.6, 0, Math.PI*2); ctx.fill();
        });
    }

    function loop() { update(); render(); requestAnimationFrame(loop); }
    loop();
</script>
</body>
</html>
