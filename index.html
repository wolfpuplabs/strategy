<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>North & South: Mini Skirmish</title>
    <style>
        body {
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; }
        p { margin-top: 0; font-size: 14px; color: #bdc3c7; }
        canvas {
            background-color: #55a630; /* Warna rumput */
            border: 4px solid #ecf0f1;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        button {
            background-color: #2980b9;
            color: white;
            border: 2px solid #ecf0f1;
            padding: 10px 20px;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }
        button:hover { background-color: #3498db; }
        button:disabled { background-color: #7f8c8d; cursor: not-allowed; }
        #status { font-size: 20px; font-weight: bold; margin-top: 15px; color: #f1c40f; }
    </style>
</head>
<body>

    <h1>North & South: Skirmish</h1>
    <p>Hancurkan markas Selatan (Kanan). Kumpulkan emas dan kerahkan pasukanmu!</p>
    
    <canvas id="gameCanvas" width="800" height="300"></canvas>

    <div class="controls">
        <button id="btn-infantry" onclick="spawnUnit(0, 'infantry')">1. Infantri (Cost: 10)</button>
        <button id="btn-cavalry" onclick="spawnUnit(0, 'cavalry')">2. Kavaleri (Cost: 20)</button>
        <button id="btn-cannon" onclick="spawnUnit(0, 'cannon')">3. Meriam (Cost: 40)</button>
    </div>
    
    <div id="status">Emas: <span id="goldDisplay">0</span> | Markas Utara: <span id="hpNorth">1000</span> | Markas Selatan: <span id="hpSouth">1000</span></div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Game State
    let gold = 50;
    let frames = 0;
    let gameOver = false;
    
    const bases = {
        0: { hp: 1000, x: 0, color: '#2980b9' }, // North (Blue)
        1: { hp: 1000, x: 750, color: '#7f8c8d' } // South (Gray)
    };

    const unitStats = {
        infantry: { cost: 10, hp: 30, speed: 1, range: 100, damage: 5, cd: 60, color: '#3498db', size: 10 },
        cavalry: { cost: 20, hp: 50, speed: 2.5, range: 15, damage: 10, cd: 30, color: '#1abc9c', size: 12 },
        cannon: { cost: 40, hp: 40, speed: 0.5, range: 300, damage: 40, cd: 150, color: '#34495e', size: 16 }
    };

    let units = [];
    let projectiles = [];

    function spawnUnit(team, type) {
        if (team === 0) {
            if (gold < unitStats[type].cost) return;
            gold -= unitStats[type].cost;
        }
        
        let stats = unitStats[type];
        units.push({
            team: team,
            type: type,
            x: team === 0 ? 50 : 730,
            y: 100 + Math.random() * 150, // Random lane position
            hp: stats.hp,
            maxHp: stats.hp,
            speed: team === 0 ? stats.speed : -stats.speed,
            range: stats.range,
            damage: stats.damage,
            cooldown: 0,
            maxCd: stats.cd,
            color: team === 0 ? stats.color : '#95a5a6',
            size: stats.size
        });
    }

    // AI logic for the South
    function aiLogic() {
        if (frames % 120 === 0) {
            let rand = Math.random();
            if (rand < 0.5) spawnUnit(1, 'infantry');
            else if (rand < 0.8) spawnUnit(1, 'cavalry');
            else spawnUnit(1, 'cannon');
        }
    }

    function update() {
        if (gameOver) return;

        frames++;
        if (frames % 10 === 0) gold += 1; // Passive income

        document.getElementById("goldDisplay").innerText = gold;
        document.getElementById("hpNorth").innerText = Math.max(0, bases[0].hp);
        document.getElementById("hpSouth").innerText = Math.max(0, bases[1].hp);

        // Update Buttons
        document.getElementById("btn-infantry").disabled = gold < 10;
        document.getElementById("btn-cavalry").disabled = gold < 20;
        document.getElementById("btn-cannon").disabled = gold < 40;

        aiLogic();

        // Update Projectiles
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;

            // Collision with units
            units.forEach(u => {
                if (u.team !== p.team && Math.abs(u.x - p.x) < u.size && Math.abs(u.y - p.y) < u.size) {
                    u.hp -= p.damage;
                    p.life = 0; // Destroy projectile
                }
            });

            if (p.life <= 0) projectiles.splice(i, 1);
        }

        // Update Units
        for (let i = units.length - 1; i >= 0; i--) {
            let u = units[i];
            
            // Death
            if (u.hp <= 0) {
                units.splice(i, 1);
                continue;
            }

            // Cooldown
            if (u.cooldown > 0) u.cooldown--;

            // Find target (enemy unit or base)
            let target = null;
            let minDist = u.range;

            // Check enemy units
            units.forEach(enemy => {
                if (enemy.team !== u.team && Math.abs(enemy.y - u.y) < 40) {
                    let dist = Math.abs(enemy.x - u.x);
                    if (dist < minDist && ((u.team === 0 && enemy.x > u.x) || (u.team === 1 && enemy.x < u.x))) {
                        minDist = dist;
                        target = enemy;
                    }
                }
            });

            // Check base if no unit target
            let distToBase = u.team === 0 ? 800 - u.x : u.x;
            if (!target && distToBase <= u.range) {
                target = "base";
            }

            if (target) {
                // Attack
                if (u.cooldown === 0) {
                    if (target === "base") {
                        bases[u.team === 0 ? 1 : 0].hp -= u.damage;
                    } else if (u.type === 'cannon' || u.type === 'infantry') {
                        // Shoot projectile
                        let dx = target.x - u.x;
                        let dy = target.y - u.y;
                        let mag = Math.sqrt(dx*dx + dy*dy);
                        projectiles.push({
                            x: u.x, y: u.y,
                            vx: (dx/mag) * 5, vy: (dy/mag) * 5,
                            damage: u.damage, team: u.team, life: 60
                        });
                    } else {
                        // Melee
                        target.hp -= u.damage;
                    }
                    u.cooldown = u.maxCd;
                }
            } else {
                // Move forward
                u.x += u.speed;
            }
        }

        // Check Win/Loss
        if (bases[0].hp <= 0) {
            gameOver = true;
            alert("Kekalahan! Pasukan Selatan berhasil menghancurkan markasmu.");
        } else if (bases[1].hp <= 0) {
            gameOver = true;
            alert("Kemenangan! Pasukan Utara telah merebut wilayah Selatan.");
        }
    }

    function draw() {
        // Clear canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Bases
        ctx.fillStyle = bases[0].color;
        ctx.fillRect(0, 0, 50, canvas.height); // North Base
        
        ctx.fillStyle = bases[1].color;
        ctx.fillRect(750, 0, 50, canvas.height); // South Base

        // Draw Health Bars for Bases
        ctx.fillStyle = "red";
        ctx.fillRect(5, 10, 40, (1 - bases[0].hp/1000) * 280);
        ctx.fillRect(755, 10, 40, (1 - bases[1].hp/1000) * 280);

        // Draw Units
        units.forEach(u => {
            ctx.fillStyle = u.color;
            if (u.type === 'cavalry') {
                ctx.beginPath();
                ctx.arc(u.x, u.y, u.size, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillRect(u.x - u.size/2, u.y - u.size/2, u.size, u.size);
            }

            // Unit Health
            ctx.fillStyle = "red";
            ctx.fillRect(u.x - u.size/2, u.y - u.size - 5, u.size, 3);
            ctx.fillStyle = "lightgreen";
            ctx.fillRect(u.x - u.size/2, u.y - u.size - 5, u.size * (u.hp / unitStats[u.type].hp), 3);
        });

        // Draw Projectiles
        ctx.fillStyle = "black";
        projectiles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function gameLoop() {
        update();
        draw();
        if (!gameOver) requestAnimationFrame(gameLoop);
    }

    // Keyboard support
    window.addEventListener("keydown", (e) => {
        if (e.key === "1") spawnUnit(0, 'infantry');
        if (e.key === "2") spawnUnit(0, 'cavalry');
        if (e.key === "3") spawnUnit(0, 'cannon');
    });

    gameLoop();
</script>
</body>
</html>
