<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>North & South: Pro Stages</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    
    <style>
        body {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            margin: 0; padding: 0; background-color: #1a1a1a;
            overflow: hidden; touch-action: none; 
            font-family: 'Fredoka One', cursive, sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        
        #game-wrapper {
            position: absolute; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        
        canvas {
            width: 100%; height: 100%; object-fit: contain;
            background-color: #7bc05b;
        }
        
        /* UI Panel Atas */
        .hud {
            position: absolute; top: 15px; width: 95%; max-width: 900px;
            display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none;
        }
        .badge {
            background: linear-gradient(to bottom, #ecf0f1, #bdc3c7);
            padding: 8px 25px; border-radius: 25px; border: 4px solid #2c3e50; color: #2c3e50;
            box-shadow: 0 6px 0 #2c3e50, 0 10px 15px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 10px; font-size: 16px;
        }
        .stage-badge {
            background: linear-gradient(to bottom, #f1c40f, #f39c12); color: white;
            border-color: #fff; box-shadow: 0 6px 0 #d35400, 0 10px 15px rgba(0,0,0,0.5);
            text-shadow: 2px 2px 0 #d35400; font-size: 24px; padding: 5px 25px;
        }
        .dot { width: 16px; height: 16px; border-radius: 50%; border: 3px solid #2c3e50; }

        /* KONTROL BAWAH */
        #controls {
            position: absolute; bottom: 30px; width: 95%; max-width: 950px;
            display: flex; justify-content: space-between; align-items: flex-end; z-index: 20;
        }
        
        .dpad { display: grid; grid-template-columns: 65px 65px 65px; grid-template-rows: 65px 65px 65px; gap: 8px; }
        .dpad-btn {
            background: linear-gradient(to bottom, #ffffff, #dcdde1);
            border: 4px solid #2c3e50; border-radius: 20px; display: flex; justify-content: center; align-items: center;
            font-size: 28px; color: #2c3e50; cursor: pointer; box-shadow: 0 6px 0 #2c3e50, 0 10px 10px rgba(0,0,0,0.3);
        }
        .dpad-btn:active, .dpad-btn.active { transform: translateY(6px); box-shadow: 0 0 0 #2c3e50, 0 4px 5px rgba(0,0,0,0.3); background: #f1c40f; }
        .empty { visibility: hidden; }

        .actions { display: flex; align-items: flex-end; gap: 20px; }
        .squad-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 180px; }
        .act-btn {
            background: linear-gradient(to bottom, #3498db, #2980b9); border: 4px solid #1a252f; border-radius: 15px; color: white;
            font-size: 14px; display: flex; justify-content: center; align-items: center; box-shadow: 0 6px 0 #1a252f, 0 8px 10px rgba(0,0,0,0.4);
            height: 45px; cursor: pointer; text-shadow: 1px 1px 0 #000;
        }
        .act-btn.selected { background: linear-gradient(to bottom, #f1c40f, #f39c12); color: #fff; border-color: #2c3e50; box-shadow: 0 6px 0 #d35400; text-shadow: 1px 1px 0 #d35400; }
        .act-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #1a252f; }
        .btn-full { grid-column: span 2; }
        
        .fire-btn { 
            background: linear-gradient(to bottom, #ff7675, #e74c3c); border: 5px solid #2c3e50; border-radius: 50%; 
            width: 90px; height: 90px; display: flex; justify-content: center; align-items: center;
            color: white; font-size: 26px; cursor: pointer; box-shadow: 0 8px 0 #c0392b, 0 12px 15px rgba(0,0,0,0.5);
            text-shadow: 2px 2px 0 #c0392b;
        }
        .fire-btn:active, .fire-btn.active { background: #c0392b; transform: translateY(8px); box-shadow: 0 0 0 #c0392b; border-color: #f1c40f; }

        /* MODAL GAME OVER / NEXT STAGE */
        #game-over-modal {
            display: none; position: absolute; z-index: 100; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: linear-gradient(to bottom, #34495e, #2c3e50); border: 6px solid #f1c40f; border-radius: 25px;
            padding: 40px; text-align: center; color: white; width: 300px; box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }
        #game-over-msg { font-size: 32px; text-shadow: 2px 2px 0 #000; letter-spacing: 2px; margin-top: 0; }
        #btn-action {
            margin-top: 25px; padding: 15px 20px; background: linear-gradient(to bottom, #f1c40f, #f39c12); color: #fff;
            border: 4px solid #2c3e50; border-radius: 15px; font-size: 20px; cursor: pointer; width: 100%;
            box-shadow: 0 6px 0 #d35400; text-shadow: 1px 1px 0 #d35400; font-family: 'Fredoka One', cursive;
        }
        #btn-action:active { transform: translateY(6px); box-shadow: 0 0 0 #d35400; }

        @media (max-width: 750px) {
            .dpad { grid-template-columns: 55px 55px 55px; grid-template-rows: 55px 55px 55px; }
            .dpad-btn { font-size: 20px; border-width: 3px; box-shadow: 0 4px 0 #2c3e50; }
            .squad-grid { width: 130px; }
            .act-btn { height: 35px; font-size: 11px; box-shadow: 0 4px 0 #1a252f; }
            .fire-btn { width: 75px; height: 75px; font-size: 18px; border-width: 4px; box-shadow: 0 6px 0 #c0392b; }
            .badge { padding: 5px 15px; font-size: 11px; }
            .stage-badge { font-size: 16px; padding: 5px 15px; }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        
        <div class="hud">
            <div class="badge"><div class="dot" style="background:#3498db;"></div> UNION</div>
            <div class="badge stage-badge" id="stage-hud">STAGE 1</div>
            <div class="badge">CONFEDERATE <div class="dot" style="background:#e74c3c;"></div></div>
        </div>

        <div id="controls">
            <div class="dpad">
                <div class="empty"></div><div class="dpad-btn" id="btn-up">W</div><div class="empty"></div>
                <div class="dpad-btn" id="btn-left">A</div><div class="dpad-btn" id="btn-down">S</div><div class="dpad-btn" id="btn-right">D</div>
            </div>
            
            <div class="actions">
                <div class="squad-grid">
                    <div class="act-btn selected" id="btn-inf" onclick="switchSquad('infantry')">INF</div>
                    <div class="act-btn" id="btn-cav" onclick="switchSquad('cavalry')">CAV</div>
                    <div class="act-btn btn-full" id="btn-can" onclick="switchSquad('cannon')">CANNON</div>
                </div>
                <div class="fire-btn" id="btn-fire">FIRE</div>
            </div>
        </div>
        
        <div id="game-over-modal">
            <h2 id="game-over-msg">STAGE CLEARED</h2>
            <button id="btn-action" onclick="handleModalAction()">NEXT STAGE</button>
        </div>
    </div>

<script>
    // --- SFX AUDIO ENGINE ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const actx = new AudioContext();

    function playSound(type) {
        if (actx.state === 'suspended') actx.resume();
        const osc = actx.createOscillator(); const gain = actx.createGain();
        osc.connect(gain); gain.connect(actx.destination);
        let now = actx.currentTime;
        
        if (type === 'click') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'shoot') {
            osc.type = 'square'; osc.frequency.setValueAtTime(150, now);
            gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'cannon') { 
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now); osc.frequency.exponentialRampToValueAtTime(10, now + 0.6);
            gain.gain.setValueAtTime(0.8, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
            osc.start(now); osc.stop(now + 0.6);
        } else if (type === 'hitRock') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(80, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
            gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now); osc.stop(now + 0.3);
        }
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const bgImage = new Image(); bgImage.src = 'image.png'; 

    function resize() {
        let scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        canvas.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resize); resize();

    // Input Control
    const keys = { w:false, a:false, s:false, d:false, space:false };
    function bindBtn(id, key) {
        const el = document.getElementById(id);
        if(!el) return;
        const press = (e) => { 
            e.preventDefault(); keys[key] = true; el.classList.add('active'); 
            if(!['w','a','s','d','space'].includes(key)) playSound('click');
        };
        const release = (e) => { e.preventDefault(); keys[key] = false; el.classList.remove('active'); };
        el.addEventListener('touchstart', press, {passive: false}); el.addEventListener('touchend', release, {passive: false});
        el.addEventListener('mousedown', press); el.addEventListener('mouseup', release); el.addEventListener('mouseleave', release);
    }
    bindBtn('btn-up', 'w'); bindBtn('btn-down', 's'); bindBtn('btn-left', 'a'); bindBtn('btn-right', 'd'); bindBtn('btn-fire', 'space');

    window.addEventListener('keydown', (e) => {
        if(e.key === 'w' || e.key === 'ArrowUp') keys.w = true;
        if(e.key === 's' || e.key === 'ArrowDown') keys.s = true;
        if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = true;
        if(e.key === 'd' || e.key === 'ArrowRight') keys.d = true;
        if(e.key === ' ' || e.code === 'Space') keys.space = true;
    });
    window.addEventListener('keyup', (e) => {
        if(e.key === 'w' || e.key === 'ArrowUp') keys.w = false;
        if(e.key === 's' || e.key === 'ArrowDown') keys.s = false;
        if(e.key === 'a' || e.key === 'ArrowLeft') keys.a = false;
        if(e.key === 'd' || e.key === 'ArrowRight') keys.d = false;
        if(e.key === ' ' || e.code === 'Space') keys.space = false;
    });

    let activeSquad = 'infantry';
    window.switchSquad = function(type) {
        playSound('click');
        activeSquad = type;
        document.querySelectorAll('.squad-grid .act-btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('btn-' + type.substring(0,3)).classList.add('selected');
    };

    // --- SYSTEM STAGE ---
    let currentStage = 1;
    let timeOfDay = 'day'; // day, sunset, night
    let isVictory = false;

    // COLLIDER MAP & ENVIRONMENT
    const MAP = { riverX: 520, riverW: 220, bridgeY: 310, bridgeH: 130 };

    function canMoveTo(x, y) {
        if (x < 30 || x > 1250 || y < 60 || y > 680) return false;
        
        let inWaterX = x > MAP.riverX && x < (MAP.riverX + MAP.riverW);
        let onBridgeY = y > MAP.bridgeY && y < (MAP.bridgeY + MAP.bridgeH);
        if (inWaterX && !onBridgeY) return false;
        
        // Rintangan Batu/Pohon (Collider)
        for(let obs of obstacles) {
            if(obs.alive && Math.hypot(x - obs.x, y - obs.y) < obs.radius + 15) return false;
        }

        return true;
    }

    let gameOver = false, frames = 0;
    let union, confed, projectiles, fx, obstacles;

    // Formasi Acak Tiap Stage
    function initTeam(team, startX, dir, infCount, cavCount) {
        let jitterY = (Math.random() - 0.5) * 50; // Posisi Y sedikit random tiap level
        for(let i=0; i<infCount; i++) {
            team.infantry.push({ 
                x: startX + (i%2)*40*-dir + (Math.random()*10), 
                y: 150 + jitterY + Math.floor(i/2)*70 + (Math.random()*10), 
                speed: 1.5, cd: 0, alive: true, team: dir===1?0:1, frame: Math.random()*10 
            });
        }
        for(let i=0; i<cavCount; i++) {
            team.cavalry.push({ 
                x: startX + 110*-dir + (Math.random()*10), 
                y: 180 + jitterY + i*80 + (Math.random()*10), 
                speed: 2.8, alive: true, team: dir===1?0:1, frame: Math.random()*10 
            });
        }
    }

    function generateObstacles(count) {
        obstacles = [];
        for(let i=0; i<count; i++) {
            let valid = false;
            let ox, oy;
            while(!valid) {
                ox = 350 + Math.random() * 600; // Tengah peta
                oy = 100 + Math.random() * 550;
                // Pastikan tidak menghalangi jembatan sepenuhnya
                if (!(ox > 450 && ox < 800 && oy > 250 && oy < 500)) {
                    valid = true;
                }
            }
            obstacles.push({
                x: ox, y: oy, 
                type: Math.random() > 0.5 ? 'rock' : 'tree', 
                radius: 25, alive: true 
            });
        }
    }

    function startStage(stage) {
        playSound('click');
        document.getElementById('game-over-modal').style.display = 'none';
        
        currentStage = stage;
        document.getElementById('stage-hud').innerText = 'STAGE ' + currentStage;
        
        // Atur waktu (Siklus: Siang, Sore, Malam)
        let times = ['day', 'sunset', 'night'];
        timeOfDay = times[(currentStage - 1) % 3];

        // Skala Kesulitan
        let enemySpd = 1.3 + (currentStage * 0.1);
        let extraInf = Math.min(10, 6 + Math.floor(currentStage/2)); // Maks 10
        let extraCav = Math.min(6, 3 + Math.floor(currentStage/3));  // Maks 6

        union = { color: '#2980b9', pants: '#1c5982', cannon: { x: 100, y: 350, alive: true, cd: 0, speed: 1.8, frame:0 }, infantry: [], cavalry: [] };
        confed = { color: '#bdc3c7', pants: '#7f8c8d', cannon: { x: 1180, y: 350, alive: true, cd: 0, speed: enemySpd, frame:0 }, infantry: [], cavalry: [], aiState: 'infantry', aiTimer: 0 };
        
        projectiles = []; fx = []; 
        generateObstacles(3 + currentStage); // Rintangan bertambah tiap stage

        initTeam(union, 250, 1, 6, 3); // Player tetap
        initTeam(confed, 1030, -1, extraInf, extraCav); // Musuh bertambah
        
        gameOver = false; keys.space = false;
    }

    // Panggilan Awal
    startStage(1);

    window.handleModalAction = function() {
        if (isVictory) startStage(currentStage + 1); // Next Stage
        else startStage(currentStage); // Retry
    };

    function moveGroup(group, dx, dy, isAI = false) {
        group.forEach(u => {
            if(u.alive) {
                let nx = u.x + dx * u.speed; let ny = u.y + dy * u.speed;
                let moved = false;
                
                if (canMoveTo(nx, u.y)) { u.x = nx; moved = true; }
                if (canMoveTo(u.x, ny)) { u.y = ny; moved = true; }

                if (isAI && !moved && dx < 0 && u.x >= MAP.riverX + MAP.riverW - 10) {
                    let bc = MAP.bridgeY + (MAP.bridgeH / 2);
                    if (u.y < bc - 10) u.y += u.speed;
                    else if (u.y > bc + 10) u.y -= u.speed;
                }
                
                if(moved && (dx!==0 || dy!==0)) {
                    u.frame += 0.5;
                    if(frames % 10 === 0 && Math.random() < 0.5) fx.push({ x: u.x, y: u.y+5, type: 'dust', life: 15 });
                }
            }
        });
    }

    function fireCannon(cannon, isUnion) {
        if(cannon.cd <= 0 && cannon.alive) {
            playSound('shoot');
            projectiles.push({ x: isUnion ? cannon.x+40 : cannon.x-40, y: cannon.y-25, vx: isUnion ? 9 : -9, type: 'ball', isUnion: isUnion, life: 120 });
            fx.push({ x: isUnion ? cannon.x+45 : cannon.x-45, y: cannon.y-25, type: 'flash', life: 5 }); 
            cannon.cd = 90;
        }
    }

    function update() {
        if(gameOver) return;
        frames++;

        let dx = 0, dy = 0;
        if(keys.w) dy = -1; if(keys.s) dy = 1;
        if(keys.a) dx = -1; if(keys.d) dx = 1;

        // Player Update
        if(activeSquad === 'cannon' && union.cannon.alive) {
            union.cannon.y += dy * union.cannon.speed;
            if(dy !== 0) union.cannon.frame += 0.5;
            if(union.cannon.y < 80) union.cannon.y = 80; if(union.cannon.y > 680) union.cannon.y = 680;
            if(keys.space) fireCannon(union.cannon, true);
        } else if(activeSquad === 'infantry') {
            moveGroup(union.infantry, dx, dy);
            if(keys.space) {
                let shotFired = false;
                union.infantry.forEach(u => {
                    if(u.alive && u.cd <= 0) { 
                        projectiles.push({ x: u.x+20, y: u.y-25, vx: 10, type: 'bullet', isUnion: true, life: 70 }); 
                        fx.push({ x: u.x+25, y: u.y-25, type: 'flash', life: 4 });
                        u.cd = 40; shotFired = true;
                    }
                });
                if(shotFired) playSound('shoot');
            }
        } else if(activeSquad === 'cavalry') {
            moveGroup(union.cavalry, dx, dy);
        }

        if(union.cannon.cd > 0) union.cannon.cd--;
        union.infantry.forEach(u => { if(u.cd > 0) u.cd--; });

        // AI Update
        confed.aiTimer--;
        if(confed.aiTimer <= 0) {
            let ch = [];
            if(confed.infantry.some(u=>u.alive)) ch.push('infantry');
            if(confed.cavalry.some(u=>u.alive)) ch.push('cavalry');
            if(confed.cannon.alive) ch.push('cannon');
            if(ch.length > 0) { confed.aiState = ch[Math.floor(Math.random()*ch.length)]; confed.aiTimer = 50 + Math.random()*40; }
        }

        if(confed.aiState === 'cannon' && confed.cannon.alive) {
            let aiDy = (Math.random() > 0.5 ? 1 : -1);
            confed.cannon.y += aiDy * confed.cannon.speed;
            confed.cannon.frame += 0.5;
            if(confed.cannon.y < 80) confed.cannon.y = 80; if(confed.cannon.y > 680) confed.cannon.y = 680;
            if(Math.random() < 0.02) fireCannon(confed.cannon, false);
        } else if(confed.aiState === 'infantry') {
            moveGroup(confed.infantry, -0.8, (Math.random()-0.5), true);
            if(Math.random() < 0.05) {
                let shotFired = false;
                confed.infantry.forEach(u => {
                    if(u.alive && u.cd <= 0 && Math.random() < 0.3) { 
                        projectiles.push({ x: u.x-20, y: u.y-25, vx: -10, type: 'bullet', isUnion: false, life: 70 }); 
                        fx.push({ x: u.x-25, y: u.y-25, type: 'flash', life: 4 });
                        u.cd = 50; shotFired = true;
                    }
                });
                if(shotFired) playSound('shoot');
            }
        } else if(confed.aiState === 'cavalry') {
            moveGroup(confed.cavalry, -1.2, (Math.random()-0.5)*2, true);
        }
        if(confed.cannon.cd > 0) confed.cannon.cd--;
        confed.infantry.forEach(u => { if(u.cd > 0) u.cd--; });

        // --- PHYSICS (Peluru & Meriam vs Pasukan & Rintangan) ---
        for(let i=projectiles.length-1; i>=0; i--) {
            let p = projectiles[i]; p.x += p.vx; p.life--;
            let eTeam = p.isUnion ? confed : union;
            
            // Cek Tabrakan Rintangan Batu/Pohon
            let hitObs = null;
            for(let o of obstacles) {
                if(o.alive && Math.hypot(o.x - p.x, o.y - p.y) < o.radius + 10) { hitObs = o; break; }
            }

            if(p.type === 'ball') {
                if(frames%3===0) fx.push({x: p.x, y: p.y, type:'smoke', life: 10});

                let directHit = false;
                if(hitObs) directHit = true;
                eTeam.infantry.forEach(u => { if(!directHit && u.alive && Math.abs(u.x-p.x) < 30 && Math.abs(u.y-p.y) < 35) directHit = true; });
                eTeam.cavalry.forEach(u => { if(!directHit && u.alive && Math.abs(u.x-p.x) < 40 && Math.abs(u.y-p.y) < 40) directHit = true; });
                if(!directHit && eTeam.cannon.alive && Math.abs(eTeam.cannon.x-p.x) < 50 && Math.abs(eTeam.cannon.y-p.y) < 50) directHit = true;

                if(p.life <= 0 || directHit) {
                    playSound('cannon'); 
                    fx.push({ x: p.x, y: p.y, type: 'boom', r: 0, life: 35 });
                    for(let k=0; k<6; k++) fx.push({ x: p.x, y: p.y, type: 'debris', vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12, life: 25 });
                    
                    // Radius ledakan menghancurkan rintangan
                    obstacles.forEach(o => { if(o.alive && Math.hypot(o.x-p.x, o.y-p.y) < 60) { o.alive = false; playSound('hitRock'); }});
                    
                    // Merusak musuh
                    eTeam.infantry.forEach(u => { if(u.alive && Math.hypot(u.x-p.x, u.y-p.y) < 85) { u.alive = false; fx.push({x: u.x, y: u.y, type:'smoke', life:15}); }});
                    eTeam.cavalry.forEach(u => { if(u.alive && Math.hypot(u.x-p.x, u.y-p.y) < 95) { u.alive = false; fx.push({x: u.x, y: u.y, type:'smoke', life:15}); }});
                    if(eTeam.cannon.alive && Math.hypot(eTeam.cannon.x-p.x, eTeam.cannon.y-p.y) < 100) { eTeam.cannon.alive = false; fx.push({x: eTeam.cannon.x, y: eTeam.cannon.y, type:'smoke', life:25}); }
                    
                    projectiles.splice(i, 1); continue;
                }
            }
            else if(p.type === 'bullet') {
                if(hitObs) {
                    // Peluru senapan terblokir oleh batu/pohon (TIDAK menghancurkan)
                    fx.push({x: p.x, y: p.y, type: 'smoke', life: 5});
                    projectiles.splice(i, 1); continue;
                }
                
                let hit = false;
                eTeam.infantry.forEach(u => { if(!hit && u.alive && Math.abs(u.x-p.x)<18 && Math.abs(u.y-p.y)<18) { u.alive = false; hit = true; }});
                eTeam.cavalry.forEach(u => { if(!hit && u.alive && Math.abs(u.x-p.x)<25 && Math.abs(u.y-p.y)<25) { u.alive = false; hit = true; }});
                if(hit) {
                    fx.push({x: p.x, y: p.y, type: 'smoke', life: 10});
                    projectiles.splice(i, 1);
                } else if(p.life <= 0) projectiles.splice(i, 1);
            }
        }

        // Efek Updates
        for(let i=fx.length-1; i>=0; i--) { 
            let f = fx[i];
            if(f.type === 'boom') f.r += (70 - f.r)*0.15;
            else if(f.type === 'debris') { f.x += f.vx; f.y += f.vy; }
            f.life--; 
            if(f.life <= 0) fx.splice(i,1); 
        }

        // Melee
        union.cavalry.forEach(uc => {
            if(!uc.alive) return;
            confed.infantry.forEach(ci => { if(ci.alive && Math.hypot(uc.x-ci.x, uc.y-ci.y) < 35) { ci.alive = false; fx.push({x: ci.x, y: ci.y, type:'smoke', life: 15}); }});
            confed.cavalry.forEach(cc => { if(cc.alive && Math.hypot(uc.x-cc.x, uc.y-cc.y) < 35) { cc.alive = false; uc.alive = false; fx.push({x: cc.x, y: cc.y, type:'smoke', life: 20}); }});
            if(confed.cannon.alive && Math.hypot(uc.x-confed.cannon.x, uc.y-confed.cannon.y) < 45) confed.cannon.alive = false;
        });

        // Win Cond
        let uAlive = union.cannon.alive || union.infantry.some(u=>u.alive) || union.cavalry.some(u=>u.alive);
        let cAlive = confed.cannon.alive || confed.infantry.some(u=>u.alive) || confed.cavalry.some(u=>u.alive);
        
        if(!uAlive || !cAlive) {
            gameOver = true;
            playSound('cannon');
            const modal = document.getElementById('game-over-modal');
            const msg = document.getElementById('game-over-msg');
            const btn = document.getElementById('btn-action');
            
            isVictory = !cAlive && uAlive; // Seri dihitung kalah
            
            if (isVictory) {
                msg.innerHTML = "STAGE CLEARED!<br><span style='font-size:16px; font-family:sans-serif;'>Get ready for next wave</span>";
                msg.style.color = "#2ecc71";
                btn.innerText = "NEXT STAGE";
            } else {
                msg.innerHTML = "DEFEAT!<br><span style='font-size:16px; font-family:sans-serif;'>Union Destroyed</span>";
                msg.style.color = "#e74c3c";
                btn.innerText = "RETRY STAGE";
            }
            modal.style.display = "block";
        }
    }

    // --- 3D ENGINE ---
    function shadeCol(col, amt) {
        let num = parseInt(col.slice(1), 16);
        let r = (num >> 16) + amt; if(r>255) r=255; else if(r<0) r=0;
        let b = ((num >> 8) & 0x00FF) + amt; if(b>255) b=255; else if(b<0) b=0;
        let g = (num & 0x0000FF) + amt; if(g>255) g=255; else if(g<0) g=0;
        return "#" + (g | (b << 8) | (r << 16)).toString(16).padStart(6, '0');
    }

    function drawVoxel(x, y, w, h, d, color, isMetal = false) {
        let topC = shadeCol(color, 40); let rightC = shadeCol(color, -30);
        let gradF = ctx.createLinearGradient(0, y-h, 0, y);
        gradF.addColorStop(0, shadeCol(color, isMetal ? 50 : 15)); gradF.addColorStop(1, shadeCol(color, isMetal ? -40 : -15));
        let gradR = ctx.createLinearGradient(0, y-h, 0, y);
        gradR.addColorStop(0, shadeCol(rightC, 15)); gradR.addColorStop(1, shadeCol(rightC, -20));

        ctx.fillStyle = gradF; ctx.fillRect(x - w/2, y - h, w, h);
        ctx.fillStyle = topC; ctx.beginPath();
        ctx.moveTo(x - w/2, y - h); ctx.lineTo(x - w/2 + d, y - h - d); ctx.lineTo(x + w/2 + d, y - h - d); ctx.lineTo(x + w/2, y - h); ctx.fill();
        ctx.fillStyle = gradR; ctx.beginPath();
        ctx.moveTo(x + w/2, y - h); ctx.lineTo(x + w/2 + d, y - h - d); ctx.lineTo(x + w/2 + d, y - d); ctx.lineTo(x + w/2, y); ctx.fill();
        
        ctx.strokeStyle = "rgba(255,255,255,0.1)"; ctx.lineWidth = 1; ctx.strokeRect(x - w/2, y - h, w, h);
    }

    function drawWheel(x, y, radius, rot) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
        ctx.fillStyle = "#3e2723"; ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(0, 0, radius-4, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "#8d6e63"; ctx.lineWidth = 4;
        for(let i=0; i<4; i++) { ctx.rotate(Math.PI/4); ctx.beginPath(); ctx.moveTo(-radius, 0); ctx.lineTo(radius, 0); ctx.stroke(); }
        ctx.fillStyle = "#5d4037"; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }

    function drawObstacle(o) {
        if (!o.alive) return;
        ctx.fillStyle = "rgba(0,0,0,0.3)";
        ctx.beginPath(); ctx.ellipse(o.x, o.y, o.radius, o.radius*0.5, 0, 0, Math.PI*2); ctx.fill();
        
        if (o.type === 'rock') {
            drawVoxel(o.x, o.y, 40, 20, 30, '#7f8c8d');
            drawVoxel(o.x+8, o.y-12, 20, 15, 20, '#95a5a6');
            drawVoxel(o.x-10, o.y-5, 25, 10, 15, '#636e72');
        } else {
            drawVoxel(o.x, o.y, 12, 25, 12, '#5d4037'); // Batang
            drawVoxel(o.x, o.y-20, 40, 25, 30, '#27ae60'); // Daun Bawah
            drawVoxel(o.x, o.y-35, 25, 20, 20, '#2ecc71'); // Daun Atas
        }
    }

    function render() {
        if(bgImage.complete) ctx.drawImage(bgImage, 0, 0, 1280, 720);
        else { ctx.fillStyle = "#7bc05b"; ctx.fillRect(0,0,1280,720); }
        
        // Time of Day Overlay
        if (timeOfDay === 'sunset') {
            ctx.fillStyle = "rgba(230, 126, 34, 0.25)"; ctx.fillRect(0,0,1280,720);
        } else if (timeOfDay === 'night') {
            ctx.fillStyle = "rgba(44, 62, 80, 0.55)"; ctx.fillRect(0,0,1280,720);
        }
        
        ctx.fillStyle = "rgba(241, 196, 15, 0.4)";
        if(activeSquad === 'cannon' && union.cannon.alive) { ctx.beginPath(); ctx.ellipse(union.cannon.x, union.cannon.y, 45, 15, 0, 0, Math.PI*2); ctx.fill(); }
        else if(activeSquad === 'infantry') union.infantry.forEach(u => { if(u.alive) { ctx.beginPath(); ctx.ellipse(u.x, u.y, 20, 10, 0, 0, Math.PI*2); ctx.fill(); }});
        else if(activeSquad === 'cavalry') union.cavalry.forEach(u => { if(u.alive) { ctx.beginPath(); ctx.ellipse(u.x, u.y, 35, 15, 0, 0, Math.PI*2); ctx.fill(); }});

        let renders = [];
        if(union.cannon.alive) renders.push({y: union.cannon.y, draw: ()=> drawDetailedUnit(union.cannon, union, 'cannon', 1)});
        if(confed.cannon.alive) renders.push({y: confed.cannon.y, draw: ()=> drawDetailedUnit(confed.cannon, confed, 'cannon', -1)});
        union.infantry.forEach(u => { if(u.alive) renders.push({y: u.y, draw: ()=> drawDetailedUnit(u, union, 'infantry', 1)}); });
        union.cavalry.forEach(u => { if(u.alive) renders.push({y: u.y, draw: ()=> drawDetailedUnit(u, union, 'cavalry', 1)}); });
        confed.infantry.forEach(u => { if(u.alive) renders.push({y: u.y, draw: ()=> drawDetailedUnit(u, confed, 'infantry', -1)}); });
        confed.cavalry.forEach(u => { if(u.alive) renders.push({y: u.y, draw: ()=> drawDetailedUnit(u, confed, 'cavalry', -1)}); });
        
        obstacles.forEach(o => { if(o.alive) renders.push({y: o.y, draw: ()=> drawObstacle(o)}); });

        renders.sort((a,b) => a.y - b.y);

        function drawDetailedUnit(u, team, type, dir) {
            let col = team.color; let pCol = team.pants;
            let walk = Math.sin(u.frame) * 8; let bob = Math.abs(Math.sin(u.frame)) * 4;

            ctx.fillStyle = "rgba(0,0,0,0.3)";
            ctx.beginPath(); ctx.ellipse(u.x, u.y, type==='cavalry'?25:(type==='cannon'?30:12), type==='cannon'?12:6, 0, 0, Math.PI*2); ctx.fill();
            
            if(type === 'cannon') {
                drawVoxel(u.x, u.y - 5, 45, 15, 15, "#795548"); 
                drawVoxel(u.x + (15*dir), u.y - 20, 50, 14, 14, "#2c3e50", true); 
                drawVoxel(u.x + (45*dir), u.y - 19, 8, 16, 16, "#1a252f", true);
                drawWheel(u.x - 15, u.y - 5, 18, u.frame * 0.5 * dir); drawWheel(u.x + 15, u.y - 5, 18, u.frame * 0.5 * dir);
            } 
            else if (type === 'infantry') {
                drawVoxel(u.x - (4*dir) + (walk*dir), u.y, 6, 12, 6, pCol);
                drawVoxel(u.x + (4*dir) - (walk*dir), u.y, 6, 12, 6, pCol);
                drawVoxel(u.x, u.y - 12 - bob, 16, 15, 10, col);
                drawVoxel(u.x, u.y - 15 - bob, 17, 3, 11, "#222"); drawVoxel(u.x + (8*dir), u.y - 15 - bob, 2, 4, 4, "#f1c40f"); 
                drawVoxel(u.x, u.y - 27 - bob, 10, 10, 10, "#f1c27d");
                drawVoxel(u.x, u.y - 37 - bob, 12, 6, 12, col); drawVoxel(u.x + (6*dir), u.y - 37 - bob, 8, 1, 10, "#111"); 
                drawVoxel(u.x + (10*dir), u.y - 12 - bob, 25, 3, 3, "#5d4037"); drawVoxel(u.x + (25*dir), u.y - 13 - bob, 15, 2, 2, "#95a5a6", true); 
            } 
            else if (type === 'cavalry') {
                let hCol = dir===1 ? "#5d4037" : "#4e342e";
                drawVoxel(u.x - 12 + walk, u.y, 5, 12, 5, "#3e2723"); drawVoxel(u.x - 6 - walk, u.y, 5, 12, 5, "#3e2723");
                drawVoxel(u.x + 12 - walk, u.y, 5, 12, 5, "#3e2723"); drawVoxel(u.x + 18 + walk, u.y, 5, 12, 5, "#3e2723");
                drawVoxel(u.x, u.y - 12 - bob, 45, 18, 16, hCol); 
                drawVoxel(u.x - (25*dir), u.y - 16 - bob, 6, 12, 4, "#222"); 
                drawVoxel(u.x + (20*dir), u.y - 28 - bob, 12, 16, 10, hCol); drawVoxel(u.x + (15*dir), u.y - 32 - bob, 6, 14, 4, "#222"); 
                drawVoxel(u.x - (5*dir), u.y - 28 - bob, 14, 14, 10, col); 
                drawVoxel(u.x - (5*dir), u.y - 42 - bob, 10, 10, 10, "#f1c27d"); 
                drawVoxel(u.x - (5*dir), u.y - 52 - bob, 12, 6, 12, col); 
                drawVoxel(u.x + (15*dir), u.y - 35 - bob, 22, 2, 3, "#ecf0f1", true); 
            }
        }
        renders.forEach(r => r.draw());

        // VFX Rendering
        projectiles.forEach(p => {
            ctx.fillStyle = p.type==='ball' ? "#111" : "#f1c40f";
            ctx.beginPath(); ctx.arc(p.x, p.y - 12, p.type==='ball'?8:3, 0, Math.PI*2); ctx.fill();
        });
        fx.forEach(f => {
            if(f.type === 'boom') {
                ctx.fillStyle = `rgba(231, 76, 60, ${f.life/30})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = `rgba(241, 196, 15, ${f.life/30})`; ctx.beginPath(); ctx.arc(f.x, f.y, f.r*0.6, 0, Math.PI*2); ctx.fill();
            } else if (f.type === 'flash') {
                ctx.fillStyle = `rgba(255, 200, 0, ${f.life/5})`; ctx.beginPath(); ctx.arc(f.x, f.y, 15, 0, Math.PI*2); ctx.fill();
            } else if (f.type === 'dust') {
                ctx.fillStyle = `rgba(139, 69, 19, ${f.life/30})`; ctx.beginPath(); ctx.arc(f.x, f.y, 8, 0, Math.PI*2); ctx.fill();
            } else if (f.type === 'smoke') {
                ctx.fillStyle = `rgba(189, 195, 199, ${f.life/20})`; ctx.beginPath(); ctx.arc(f.x, f.y-10, 10, 0, Math.PI*2); ctx.fill();
            } else if (f.type === 'debris') {
                drawVoxel(f.x, f.y, 5, 5, 5, "#7f8c8d");
            }
        });
    }

    function loop() { update(); render(); requestAnimationFrame(loop); }
    loop();
</script>
